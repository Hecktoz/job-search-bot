# Companies whose public ATS job boards get checked every run.
# No login/API key needed -- Greenhouse and Lever both expose a public,
# unauthenticated JSON endpoint per company.
#
# This is a SEED list based on which ATS each company is known to use.
# ATS choice changes over time (companies migrate providers), so some
# slugs here may 404 -- that's expected and harmless, the fetcher just
# skips them and logs a warning. Run `python scripts/check_companies.py`
# after cloning to see which slugs currently resolve, and prune/add from
# there. Add any company you care about by finding its careers page URL:
#   Greenhouse: boards.greenhouse.io/<slug>          -> ats: greenhouse
#   Lever:      jobs.lever.co/<slug>                  -> ats: lever

companies:
  - { name: Stripe,        ats: greenhouse, slug: stripe }
  - { name: Airbnb,        ats: greenhouse, slug: airbnb }
